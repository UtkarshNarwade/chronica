[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronica"
version = "2.1.0"
description = "Chronica: Digital Forensics Incident Timeline & Evidence Collection Tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Chronica DFIR Team" }
]
dependencies = [
    "streamlit>=1.35.0",
    "reportlab>=4.1.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long (soft limit)
    "E402",  # module level import not at top of file (sys.path manipulation in scripts)
    "E741",  # ambiguous variable name
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
